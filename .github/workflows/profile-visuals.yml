name: Forge profile visuals

on:
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST every day
  workflow_dispatch:         # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

jobs:
  contrib-3d:
    name: 3D contribution calendar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./.github/forge-3d.json
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh 3D contribution calendar"; then
            git pull --rebase && git push
          fi

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-forge-dark.svg?color_snake=#FFF0C9&color_dots=#2A221C,#6B2A10,#B8420F,#FF5F1F,#FFB23E
            dist/snake-forge-light.svg?color_snake=#17130F&color_dots=#EDE5DC,#F7C59A,#F59A5B,#FF5F1F,#B8420F
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
